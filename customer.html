<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders – Bethel Boutique</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-50 min-h-screen">
  <div class="max-w-2xl mx-auto p-8">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-2xl font-semibold text-purple-800">Hello, {{ name }}</h1>
        <p class="text-gray-500 text-sm">Your order history</p>
      </div>
      <form action="/logout" method="post" id="logout-form">
        <button type="button" onclick="fetch('/logout',{method:'POST',credentials:'same-origin'}).then(()=>location.href='/')"
          class="text-sm text-red-600 hover:underline">Sign out</button>
      </form>
    </div>
    <div id="orders" class="bg-white rounded-xl border border-purple-100 p-6 text-sm text-gray-500">
      Loading…
    </div>
  </div>
  <script>
    fetch('/api/customer/orders', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(orders => {
        const el = document.getElementById('orders');
        if (!orders.length) {
          el.textContent = 'No orders yet.';
          return;
        }
        el.innerHTML = orders.map(o => `
          <div class="flex justify-between py-3 border-b border-purple-50">
            <span>Order #${o.id}</span>
            <span>${(o.created_at || '').slice(0,10)}</span>
            <span class="font-medium">KES ${Number(o.total||0).toLocaleString()}</span>
            <span>${o.status || ''}</span>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('orders').textContent = 'Could not load orders.';
      });
  </script>
</body>
</html>
